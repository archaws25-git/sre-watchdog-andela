[project]
name = "sre-watchdog"
version = "1.0.0"
description = "AI-powered Intelligent Observability & Event Watchdog for SRE teams"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Arch Sub"},
]
keywords = ["sre", "observability", "anomaly-detection", "fastapi", "bedrock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "property: Property-based tests",
    "live_bedrock: Tests requiring real AWS Bedrock credentials (slow, costs money)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
show_error_codes = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[tool.flake8]
max-line-length = 120
exclude = [".venv", "__pycache__", ".git"]
ignore = ["E203", "W503"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
