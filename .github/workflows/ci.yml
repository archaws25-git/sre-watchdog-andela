name: CI — Tests & Linting

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, sre-watchdog-andela]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 linting
        run: flake8 app/ tests/ generate_logs.py

      - name: Run mypy type checking
        run: mypy app/ || true

      - name: Run tests with coverage
        run: pytest -m "not live_bedrock" --cov=app --cov-branch --cov-report=term-missing --cov-fail-under=80

      - name: Verify app imports cleanly
        run: python -c "from app.main import app; print(f'Routes: {len(app.routes)}')"
